# Serves the game through the server's existing Cloudflare Tunnel: joins the
# shared external `cloudflared-tunnel` network that the tunnel container is on.
# Tunnel route: http://majesty-maker:80. No host ports are published.
services:
  web:
    build: .
    container_name: majesty-maker
    restart: unless-stopped
    networks: [tunnel]

networks:
  tunnel:
    external: true
    name: cloudflared-tunnel
