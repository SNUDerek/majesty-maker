# Serves the game through a Cloudflare Tunnel; no host ports are published.
# Requires TUNNEL_TOKEN in .env (see README "Deploying").
services:
  web:
    build: .
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    restart: unless-stopped
    depends_on:
      - web
